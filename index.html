colors:{ink:'var(--ink)',muted:'var(--muted)',line:'var(--line)',accent:'var(--accent)',glass:'var(--glass)'}}}}

<style>
/* Layout: nav fixa translúcida (estilo Apple) → Bento Grid de vidro sobre fundo com gradientes suaves; planta do galpão como bloco principal */
:root{
  --bg:#07090d; --ink:#eef2f5; --muted:#8c97a3; --line:rgba(255,255,255,.09); --glass:rgba(22,27,34,.55);
  --accent:#4cc3ff; --amber:#ffb547;

}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:Onest,system-ui,sans-serif;min-height:100%;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:none;opacity:.10}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-12vw;top:-14vw;background:#0e6d9c}
.aurora i:nth-child(2){width:38vw;height:38vw;right:-10vw;top:18vh;background:#b86b12;opacity:.16}

@keyframes sh{to{background-position:-200% 0}}
.tnum{font-variant-numeric:tabular-nums}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spin{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.noscroll::-webkit-scrollbar{display:none}.noscroll{scrollbar-width:none}

/* Otimização segura: mantém React/Framer originais */
.glass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script>
/* Bibliotecas pesadas sob demanda: a tela abre primeiro. */
const SVC_LIBS={};
function svcLoadOne(url){return new Promise((resolve,reject)=>{const e=document.createElement("script");e.src=url;e.async=true;e.onload=()=>resolve(true);e.onerror=()=>{e.remove();reject(new Error("Falha "+url))};document.head.appendChild(e)})}
/* tenta cada endereço em ordem: se a rede da empresa bloquear um CDN, usa o próximo */
function svcLoadScript(key,urls,ok){
  if(SVC_LIBS[key])return SVC_LIBS[key];
  urls=[].concat(urls);
  SVC_LIBS[key]=(async()=>{for(const u of urls){try{await svcLoadOne(u);if(!ok||ok())return true}catch(e){}}delete SVC_LIBS[key];throw new Error("Falha ao carregar "+key)})();
  return SVC_LIBS[key];
}
const ensureXLSX=()=>window.XLSX?Promise.resolve(true):svcLoadScript("xlsx",["https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js","https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js","https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"],()=>!!window.XLSX);
const ensureJSPDF=()=>window.jspdf?Promise.resolve(true):svcLoadScript("jspdf",["https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js","https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"],()=>!!window.jspdf);
const ensureSupabaseLib=()=>window.supabase?Promise.resolve(true):svcLoadScript("supabase",["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2"],()=>!!window.supabase);
/* lê CSV/TXT respeitando a codificação (UTF-8, UTF-16 do Excel "Texto Unicode" ou ANSI/Latin-1) */
async function svcReadText(f){const buf=new Uint8Array(await f.arrayBuffer());
  if(buf[0]===0xFF&&buf[1]===0xFE)return new TextDecoder("utf-16le").decode(buf.subarray(2));
  if(buf[0]===0xFE&&buf[1]===0xFF)return new TextDecoder("utf-16be").decode(buf.subarray(2));
  if(buf.length>3&&buf[1]===0&&buf[3]===0&&buf[0]!==0)return new TextDecoder("utf-16le").decode(buf);
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf).replace(/^\uFEFF/,"")}catch(e){return new TextDecoder("windows-1252").decode(buf)}}
/* abre qualquer planilha (xlsx/xls/xlsm/csv/txt) e devolve o workbook */
async function svcReadWorkbook(f,opts){await ensureXLSX();
  if(/\.(csv|txt|tsv)$/i.test(f.name)){let t=await svcReadText(f);const first=(t.split(/\r?\n/).find(l=>l.trim())||"");
    if(first.includes("\t"))return XLSX.read(t,{type:"string",raw:true,FS:"\t",...(opts||{})});
    if(first.split(";").length>first.split(",").length)return XLSX.read(t,{type:"string",raw:true,FS:";",...(opts||{})});
    return XLSX.read(t,{type:"string",raw:true,...(opts||{})})}
  return XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:"array",...(opts||{})})}
/* ============ DADOS ============ */
const CARRIERS={
  AL:{n:"ALC",bg:"#111111",fg:"#ffffff"},
  EC:{n:"ECO EXPRESS",bg:"#f6e2c0",fg:"#1b1b1b"},
  MS:{n:"M.J SIMÕES",bg:"#8a8a8a",fg:"#ffffff"},
  HW:{n:"HAWK",bg:"#16357a",fg:"#ffffff"},
  ME:{n:"MELI EXTRA",bg:"#f4c7ad",fg:"#1b1b1b"},
  PL:{n:"PRALOG",bg:"#7b5ea7",fg:"#ffffff"},
  OT:{n:"ONTIME",bg:"#ffef2e",fg:"#1b1b1b"},
  PC:{n:"PARCEIRO",bg:"#ffffff",fg:"#1b1b1b"},
  KG:{n:"KANGU",bg:"#f39200",fg:"#1b1b1b"},
  DL:{n:"DELUNA",bg:"#4f7a2e",fg:"#ffffff"},
  CM:{n:"COOPMETRO",bg:"#22e024",fg:"#1b1b1b"},
  DC:{n:"DECARGO",bg:"#22e6ea",fg:"#1b1b1b"},
  PY:{n:"PY",bg:"#b8860b",fg:"#ffffff"},
  X:{n:"Bloqueada",bg:"#e5262a",fg:"#ffffff"},
  V:{n:"Vazia",bg:"#e9ecef",fg:"#8a929b"}
};
function fill(o,a,b,code,s=1){if(a<=b){for(let i=a;i<=b;i+=s)o[i]=code}else{for(let i=a;i>=b;i-=s)o[i]=code}return o}
const build=steps=>{const o={};steps.forEach(st=>fill(o,...st));return o};
const LAYOUTS={
  "AM0-CHP":{map:build([[1,31,"X",2],[2,4,"AL",2],[6,8,"CM",2],[10,20,"KG",2],[22,26,"MS",2],[28,34,"X",2],
    [35,43,"HW"],[44,44,"X"],[45,49,"OT"],[50,50,"X"],[51,52,"DC"],[53,53,"X"],[54,54,"EC"],[55,55,"X"],[56,56,"DL"],[57,65,"X"],
    [88,76,"X"],[75,75,"DL"],[74,72,"EC"],[71,71,"OT"],[70,69,"PC"],[68,67,"HW"],[66,66,"CM"],[89,97,"X"]]),
    tags:{},veh:{top:"Passeio",bot:"VUC",right:"VUC"}},
  "AM":{map:build([[1,31,"ME",2],[2,8,"PC",2],[10,22,"KG",2],[24,34,"ME",2],
    [35,38,"PC"],[39,45,"DL"],[46,49,"MS"],[50,54,"AL"],[55,60,"DC"],[61,65,"X"],
    [88,79,"HW"],[78,74,"CM"],[73,73,"PY"],[72,69,"EC"],[68,66,"OT"],[89,97,"X"]]),
    tags:{},veh:{top:"Passeio",bot:"Passeio",right:"VUC"}},
  "PM":{map:build([[1,9,"DC",2],[11,17,"MS",2],[19,23,"EC",2],[25,31,"CM",2],[2,4,"KG",2],[6,6,"PY"],[8,14,"OT",2],[16,22,"DL",2],[24,34,"PC",2],
    [35,39,"KG"],[40,65,"ME"],
    [88,83,"HW"],[82,81,"AL"],[80,77,"DL"],[76,76,"DC"],[75,75,"OT"],[74,74,"EC"],[73,72,"PC"],[71,66,"HW"],[89,97,"HW"]]),
    tags:{},veh:{top:"Passeio",bot:"VUC",right:"VUC"}},
  "SD":{map:build([[1,31,"X",2],[2,6,"DC",2],[8,8,"EC"],[10,14,"OT",2],[16,20,"MS",2],[22,34,"HW",2],
    [35,37,"PC"],[38,40,"DL"],[41,42,"CM"],[43,50,"KG"],[51,65,"X"],[88,66,"X"],[89,97,"X"]]),
    tags:{},
    tagBelow:true,veh:{top:"Passeio",bot:"—",right:"VUC"}}
};
const rua=v=>v<=34?(v%2?1:2):v<=65?3:v<=88?5:4;
const area=v=>["","Rua 1 · coluna esquerda (ímpares)","Rua 2 · coluna esquerda (pares)","Rua 3 · ao lado da esteira","Rua 4 · lado direito (VUC)","Rua 5 · frente do mezanino (expedição VUC)"][rua(v)];
const vehOf=(L,v)=>v<=34?"—":v<=65?L.veh.top:v<=88?L.veh.bot:L.veh.right;
const SZ=36,STEP=42;
function pos(v){
  if(v<=34){const r=Math.floor((v-1)/2);return{x:v%2?40:86,y:98+r*STEP}}
  if(v<=65)return{x:128+(v-35)*STEP,y:56};
  if(v<=88)return{x:204+(88-v)*STEP,y:606};
  return{x:1320,y:250+(v-89)*STEP};
}
const BLOCKS_DEF={
  rampaS:{x:10,y:8,w:80,h:40,t:"RAMPA\nSAÍDA"},rampaU:{x:1300,y:130,w:98,h:40,t:"RAMPA ↑"},rampaU1:{x:1300,y:760,w:98,h:44,t:"RAMPA ↑ 1"},
  est1:{x:250,y:214,w:1000,h:24,t:"ESTEIRA"},est2:{x:250,y:296,w:1000,h:24,t:"ESTEIRA"},mez:{x:250,y:388,w:480,h:58,t:"MEZANINO"},
  exp:{x:190,y:592,w:986,h:66,t:"",dashed:true}};
const TAGS_DEF={1:{x:36,y:70},2:{x:84,y:70},3:{x:128,y:4},4:{x:1316,y:222},5:{x:204,y:578}};
const CAPS_DEF={3:{x:200,y:140},5:{x:204,y:684},4:{x:1250,y:636}};
// onde fica o nome da gaiola/rota em relação à vaga (x = centro do rótulo, ou esquerda se side)
const shortTag=t=>String(t||"").replace(/_[A-Z]{2,4}\d*$/i,"");
function tagPlace(v,below,len){const r=rua(v);const two=len>5&&v%2===0;
  if(r===3)return below?{cx:SZ/2,y:SZ+3+(two?17:0)}:{cx:SZ/2,y:two?-35:-18};
  if(r===5)return{cx:SZ/2,y:SZ+3+(two?17:0)};
  if(r===1)return{left:true,y:SZ/2-8};
  return{side:true,x:SZ+4,y:SZ/2-8}}
function mergeGeo(p){p=p||{};const slots={};for(let v=1;v<=97;v++)slots[v]=(p.slots&&p.slots[v])||pos(v);
  const blocks={};Object.keys(BLOCKS_DEF).forEach(k=>blocks[k]={...BLOCKS_DEF[k],...((p.blocks||{})[k]||{})});
  const tags={},caps={};[1,2,3,4,5].forEach(n=>{tags[n]=(p.tags||{})[n]||TAGS_DEF[n];if(CAPS_DEF[n])caps[n]=(p.caps||{})[n]||CAPS_DEF[n]});
  return {slots,blocks,tags,caps}}
function geoBounds(G){let W=0,H=0;Object.values(G.slots).forEach(p=>{W=Math.max(W,p.x+SZ);H=Math.max(H,p.y+SZ)});
  Object.values(G.blocks).forEach(b=>{W=Math.max(W,b.x+b.w);H=Math.max(H,b.y+b.h)});Object.values(G.caps).forEach(c=>{W=Math.max(W,c.x+150);H=Math.max(H,c.y+16)});
  return {W:Math.max(W+12,400),H:Math.max(H+16,300)}}
const capText=(L,n)=>n===3?"Rua 3 · "+L.veh.top+"   ←   sentido de saída":n===5?"Rua 5 · Expedição VUC"+(L.veh.bot&&L.veh.bot!=="—"?" · "+L.veh.bot:""):"Rua 4 · "+L.veh.right;
const allV=()=>{const m={};for(let v=1;v<=97;v++)m[v]="V";return m};
const EMPTY_MAP=allV();
const layoutVazio=L=>!Object.values(L.map).some(k=>k!=="V");
function groups(L){const g={};Object.entries(L.map).forEach(([v,k])=>(g[k]=g[k]||[]).push(+v));Object.values(g).forEach(a=>a.sort((x,y)=>x-y));return g}
function ranges(arr){const out=[];let i=0;while(i<arr.length){let j=i;const step=(arr[i]<=34&&arr[i+1]-arr[i]===2)?2:1;
  while(j+1<arr.length&&arr[j+1]-arr[j]===step&&(step===1||arr[j+1]<=34))j++;
  out.push(j>i?`${arr[i]}–${arr[j]}${step===2?" (ímpar/par)":""}`:`${arr[i]}`);i=j+1}return out.join(", ")}

/* ============ UI ============ */
const {useState,useEffect,useRef,useMemo}=React;
const {motion,AnimatePresence,LayoutGroup}=Motion;
const html=htm.bind(React.createElement);
const spring={type:"spring",stiffness:420,damping:32};
const tactile={};
const stagger={hidden:{},show:{transition:{staggerChildren:0,delayChildren:0}}};
const rise={hidden:{opacity:1,y:0},show:{opacity:1,y:0,transition:{duration:0}}};

function Swatch({k,size="sm"}){const c=CARRIERS[k];const cls=size==="lg"?"text-sm px-2.5 py-1 rounded-lg":"text-[10px] px-1.5 py-0.5 rounded-md";
  return html`<span class=${"font-mono font-bold inline-block "+cls} style=${{background:c.bg,color:c.fg,boxShadow:"inset 0 0 0 1px rgba(0,0,0,.25)"}}>${k}</span>`}

function Nav({cur,setCur,view,setView}){
  return html`<header class="fixed top-0 inset-x-0 z-50" style=${{paddingTop:"env(safe-area-inset-top,0px)"}}>
    <div class="glass !border-x-0 !border-t-0" style=${{background:"rgba(7,9,13,.62)"}}>
      <nav class="max-w-7xl mx-auto px-4 h-14 flex items-center gap-4">
        <div class="flex items-center gap-2 shrink-0">
          <span class="w-2 h-2 rounded-full" style=${{background:"var(--accent)",boxShadow:"0 0 12px var(--accent)"}}></span>
          <span class="font-display text-[13px] tracking-tight">SVC<span class="text-muted font-sans font-medium"> · Layouts</span></span>
        </div>
        <${LayoutGroup} id="tabs">
          <div class="ml-auto flex gap-1 overflow-x-auto noscroll p-1 rounded-full" style=${{background:"rgba(255,255,255,.05)"}} role="tablist">
            ${Object.keys(LAYOUTS).map(k=>html`<${motion.button} key=${k} id=${"tab-"+k} role="tab" aria-selected=${k===cur} onClick=${()=>setCur(k)} ...${tactile}
              class=${"relative shrink-0 px-3.5 sm:px-4 py-1.5 rounded-full text-[13px] font-medium transition-colors "+(k===cur?"text-black":"text-muted hover:text-ink")}>
              ${k===cur&&html`<${motion.span} layoutId="pill" class="absolute inset-0 rounded-full" style=${{background:"var(--ink)"}} transition=${spring}/>`}
              <span class="relative">${k}</span>
            </${motion.button}>`)}
          </div>
        </${LayoutGroup}>
      </nav>
      <div class="max-w-7xl mx-auto px-4 pb-2.5">
        <${LayoutGroup} id="views"><div class="inline-flex gap-1 p-1 rounded-full" style=${{background:"rgba(255,255,255,.05)"}}>
          ${[["planta","Layout e vagas"],["plan","Planejamento por rua"],["amais","A mais"],["equipe","Guiada"]].map(([id,t])=>html`<${motion.button} key=${id} id=${"view-"+id} ...${tactile} onClick=${()=>setView(id)}
            class=${"relative px-3.5 py-1.5 rounded-full text-[12px] font-medium "+(view===id?"text-[#04121b]":"text-muted hover:text-ink")}>
            ${view===id&&html`<${motion.span} layoutId="vpill" class="absolute inset-0 rounded-full" style=${{background:"var(--accent)"}} transition=${spring}/>`}
            <span class="relative">${t}</span></${motion.button}>`)}
        </div></${LayoutGroup}>
      </div>
    </div>
  </header>`;
}

function Card({className="",children,title,right}){
  return html`<${motion.section} variants=${rise} class=${"glass rounded-3xl p-5 sm:p-6 min-w-0 "+className}
      transition=${{duration:0}}>
    ${title&&html`<div class="flex items-center justify-between gap-3 mb-4"><h2 class="text-[11px] uppercase tracking-[.16em] text-muted font-semibold">${title}</h2>${right}</div>`}
    ${children}
  </${motion.section}>`;
}

function Skeleton(){
  const b=(c)=>html`<div class=${"glass rounded-3xl p-6 "+c}><div class="sk h-3 w-24 mb-5"></div><div class="sk h-8 w-2/3 mb-3"></div><div class="sk h-3 w-1/2"></div></div>`;
  return html`<div class="grid grid-cols-1 md:grid-cols-12 gap-4">
    ${b("md:col-span-8 h-48")}${b("md:col-span-4 h-48")}
    <div class="glass rounded-3xl p-6 md:col-span-12"><div class="sk h-3 w-32 mb-5"></div><div class="sk w-full" style=${{height:"min(52vw,560px)"}}></div></div>
    ${b("md:col-span-7 h-72")}${b("md:col-span-5 h-72")}
  </div>`;
}

function Hero({cur,L}){
  const g=groups(L);const total=Object.keys(L.map).length-(g.V||[]).length;const bloq=(g.X||[]).length;
  const n=Object.keys(g).filter(k=>k!=="X"&&k!=="V").length;const vazio=layoutVazio(L);
  const stat=(v,l,color)=>html`<div class="min-w-0"><div class="font-display text-3xl sm:text-4xl tnum" style=${{color}}>${v}</div><div class="text-muted text-xs mt-1">${l}</div></div>`;
  return html`<${Card} className="md:col-span-8">
    <div class="text-[11px] uppercase tracking-[.16em] text-muted font-semibold">Layout do SVC</div>
    <h1 class="font-display text-4xl sm:text-6xl tracking-tight mt-2 mb-6" style=${{textWrap:"balance"}}>
      <${AnimatePresence} mode="wait"><${motion.span} key=${cur} class="inline-block" initial=${{opacity:0,y:14}} animate=${{opacity:1,y:0}} exit=${{opacity:0,y:-14}} transition=${{duration:.3}}>${cur}</${motion.span}></${AnimatePresence}>
    </h1>
    ${vazio?html`<div class="rounded-2xl px-4 py-3 text-sm max-w-lg" style=${{background:"rgba(255,181,71,.1)",color:"var(--amber)"}}>Nenhum layout ${cur} carregado neste navegador. Vá em <b>Planejamento por rua › 2 · Ler desenho</b> e mande o print do dia.</div>`:html`
    <div class="grid grid-cols-3 gap-4 max-w-md">
      ${stat(total-bloq,"vagas ativas","var(--ink)")}
      ${stat(bloq,"bloqueadas (X)","#ff6b6e")}
      ${stat(n,"transportadoras","var(--accent)")}
    </div>
    <div class="text-muted text-xs mt-4">${L.readAt?"Montado em "+L.readAt+" · para trocar, leia o desenho do dia ou use Limpar layout em Editar layout":""}</div>`}
  </${Card}>`;
}

function Search({L,onPick}){
  const [q,setQ]=useState("");const v=parseInt(q,10);const k=L.map[v];
  return html`<${Card} className="md:col-span-4" title="Buscar vaga">
    <label for="busca" class="sr-only">Número da vaga</label>
    <input id="busca" inputmode="numeric" value=${q} onInput=${e=>{setQ(e.target.value.replace(/\D/g,"").slice(0,2));const n=parseInt(e.target.value,10);if(L.map[n])onPick(n)}}
      placeholder="Ex.: 73" class="w-full bg-white/5 border border-line rounded-2xl px-4 py-3 font-display text-2xl tnum placeholder:text-white/20 outline-none focus:border-[var(--accent)] transition-colors"/>
    <div class="mt-4 min-h-[72px]">
      <${AnimatePresence} mode="wait">
        ${k?html`<${motion.div} key=${v+k} initial=${{opacity:0,scale:.96}} animate=${{opacity:1,scale:1}} exit=${{opacity:0}} class="flex items-center gap-3">
            <${Swatch} k=${k} size="lg"/>
            <div class="min-w-0"><div class="font-semibold">${CARRIERS[k].n}</div><div class="text-muted text-xs">${area(v)} · ${vehOf(L,v)}</div></div>
          </${motion.div}>`
        :html`<${motion.p} key="empty" initial=${{opacity:0}} animate=${{opacity:1}} class="text-muted text-sm">${q?"Essa vaga não existe neste layout.":"Digite o número (1 a 97) para ver a transportadora."}</${motion.p}>`}
      </${AnimatePresence}>
    </div>
  </${Card}>`;
}

/* ============ IMAGEM DO LAYOUT (WhatsApp) ============ */
async function renderLayoutPNG(cur,L){
  try{await document.fonts.ready}catch(e){}
  const G=L.geo,{W:MW,H:MH}=geoBounds(G);
  const K=2,PAD=24,TOP=78,LEG_H=36;

function detectLayoutCycleFromDrawing(vagas){
  const keys=Object.keys(LAYOUTS), scores=[];
  for(const key of keys){
    const ref=LAYOUTS[key].map||{};let hit=0,total=0,strong=0;
    for(const [vv,kk] of Object.entries(vagas||{})){
      const v=+vv,r=ref[v];if(!r||!kk||kk==="V")continue;
      total++;
      if(r===kk){hit++;if(kk!=="X")strong++}
    }
    scores.push({key,hit,total,strong,pct:total?hit/total:0});
  }
  scores.sort((a,b)=>b.pct-a.pct||b.strong-a.strong||b.hit-a.hit);
  const best=scores[0],second=scores[1];
  if(!best||best.total<20)return null;
  const margin=second?best.pct-second.pct:best.pct;
  return (best.pct>=0.62 && (margin>=0.06 || best.pct>=0.82))?best.key:null;
}

function distributeRoutes(map,tags){

  Object.keys(byK).forEach(k=>{byK[k].sort((a,b)=>(a.onda||9)-(b.onda||9)||a.g.localeCompare(b.g,"pt",{numeric:true}));
    const vs=Object.keys(map).map(Number).filter(v=>map[v]===k&&!res[v]).sort((a,b)=>rua(a)-rua(b)||order(a)-order(b));
    byK[k].forEach((r,i)=>{if(vs[i]){res[vs[i]]=r.g;placed++}else left++})});
  return {tags:res,placed,left};
}

/* ============ A MAIS · motor do localizador (BASE, planification e planejamento de vários ciclos) ============ */
const AMX=(()=>{
  const up=v=>String(v??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  const rk=v=>String(v??"").toUpperCase().replace(/[^A-Z0-9_]/g,"");
  const isSaca=g=>/^SACAS?$/i.test(String(g||"").trim());
  const CICLO_RE=/(?:^|[^A-Z0-9])(AM0|AM1|AM2|PM0|PM1|PM2|PM3|SD1|SD2|SD|CHP|AM|PM)(?=$|[^A-Z0-9])/;
  const cicloFrom=s=>{const m=String(s??"").toUpperCase().replace(/_/g," ").match(CICLO_RE);return m?m[1]:""};
  const normCiclo=v=>{const s=String(v??"").trim();if(!s)return "";return cicloFrom(s)||s.toUpperCase()};
  const ORDER=["AM0","AM","AM1","AM2","PM0","PM","PM1","PM2","PM3","SD","SD1","SD2","CHP"];
  const cycSort=(a,b)=>{const ia=ORDER.indexOf(a),ib=ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||String(a).localeCompare(String(b),"pt",{numeric:true})};
  const SEMC="Sem ciclo";
  const layoutOfCiclo=c=>{c=String(c||"").toUpperCase();if(/CHP|AM0/.test(c))return "AM0-CHP";if(/^SD/.test(c))return "SD";if(/^PM/.test(c))return "PM";if(/^AM/.test(c))return "AM";return null};
  const FIELDS=[
    {k:"id",label:"ID do pacote",syn:["rtg unit external id","id unidad","unit id","id do pacote","id pacote","idpacote","shipment id","shipment","tracking","id envio","id"]},
    {k:"rota",label:"Rota",syn:["rtg route name","id planejado","n rota","numero rota","numero da rota","rota","route name","route","ruta"]},
    {k:"gaiola",label:"Gaiola",syn:["gaiola","otimizado","id otimizado","cage"]},
    {k:"rua",label:"Rua",syn:["rua","corredor","street","lane"]},
    {k:"vaga",label:"Vaga",syn:["vaga","posicao","doca","slot"]},
    {k:"onda",label:"Onda",syn:["onda cadastrada","onda","wave"]},
    {k:"parada",label:"Parada",syn:["parada","stop","sequencia","seq"]},
    {k:"transp",label:"Transportadora (MLP)",syn:["mlp","transportadora","carrier","transportista","empresa","company","logistic"]},
    {k:"veic",label:"Modal / Veículo",syn:["modal","tipo de veiculo","tipo veiculo","veiculo","vehicle"]},
    {k:"ciclo",label:"Ciclo",syn:["ciclo final atualizado","ciclo final","ciclo","cycle"]},
    {k:"ponto",label:"Bairro / Cidade",syn:["bairros","bairro","ponto","cidade","city","endereco"]},
  ];
  const JUNK=/^(n[aã]o encontrad[oa]|#n\/?a|#ref!?|-|—|null|undefined|0)$/i;
  const nh=h=>String(h??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  function scoreHeader(h,f){const H=nh(h);if(!H)return 0;let best=0;
    if(f.k==="id"&&/estimad|quantidade|qtd|total|facility|customer|rota|route/.test(H))return 0;
    f.syn.forEach((s,i)=>{let sc=0;if(H===s)sc=100-i;else if(s.length<=3){if((" "+H+" ").includes(" "+s+" "))sc=25-i}else if(H.startsWith(s))sc=60-i;else if(H.includes(s))sc=30-i;if(sc>best)best=sc});
    return best}
  function detectMap(headers,fields=FIELDS){const cand=[];fields.forEach(f=>headers.forEach((h,ci)=>{const s=scoreHeader(h,f);if(s>0)cand.push({k:f.k,ci,s})}));
    cand.sort((a,b)=>b.s-a.s);const map={},used=new Set();for(const c of cand){if(map[c.k]!==undefined||used.has(c.ci))continue;map[c.k]=c.ci;used.add(c.ci)}
    fields.forEach(f=>{if(map[f.k]===undefined)map[f.k]=-1});return map}
  function findHeaderRow(aoa,fields=FIELDS){let best=-1,bi=0;for(let r=0;r<Math.min(15,aoa.length);r++){let hits=0;(aoa[r]||[]).forEach(c=>{if(fields.some(f=>scoreHeader(c,f)>0))hits++});if(hits>best){best=hits;bi=r}}return bi}
  const cell=v=>v===null||v===undefined?"":String(v).trim();
  function normId(v){let s=String(v??"").trim();if(!s)return "";if(s[0]==="{"){try{const j=JSON.parse(s);s=String(j.id??j.shipment_id??j.ID??s)}catch(e){}}
    s=s.replace(/\s+/g,"");if(/^\d+\.0+$/.test(s))s=s.replace(/\.0+$/,"");return s.toUpperCase()}
  const lsGet=k=>{try{const v=localStorage.getItem("lam_"+k);return v?JSON.parse(v):null}catch(e){return null}};
  const lsSet=(k,v)=>{let ok=true;try{localStorage.setItem("lam_"+k,JSON.stringify(v))}catch(e){ok=false}if(onStateCb&&(k==="conns"||k==="adText"))onStateCb(k);return ok};
  const IDB={open(){return new Promise((res,rej)=>{try{const q=indexedDB.open("localizador-a-mais",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}})},
    async get(k){try{const db=await IDB.open();return await new Promise(r=>{const t=db.transaction("kv").objectStore("kv").get(k);t.onsuccess=()=>r(t.result);t.onerror=()=>r(null)})}catch(e){return null}},
    async set(k,v){try{const db=await IDB.open();return await new Promise(r=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=()=>r(true);tx.onerror=()=>r(false)})}catch(e){return false}}};

  let sources=[],extra=[],idx=new Map(),routeIdx=new Map(),routeByName=new Map();
  const fillE=(dst,src)=>{for(const k in src){if(src[k]!==""&&src[k]!==undefined&&(dst[k]===undefined||dst[k]===""))dst[k]=src[k]}};
  function rebuild(){idx=new Map();routeIdx=new Map();routeByName=new Map();
    const tier=s=>s.map.id<0?0:s.map.rota>=0?1:2;
    const ordered=[...sources,...extra].sort((a,b)=>tier(a)-tier(b));
    for(const s of ordered){const m=s.map;const g=(row,k)=>m[k]>=0?cell(row[m[k]]):"";const gj=(row,k)=>{const v=g(row,k);return JUNK.test(v)?"":v};
      for(const row of s.rows){const cic=normCiclo(gj(row,"ciclo"))||s.ciclo||SEMC;const id=normId(g(row,"id")),rota=gj(row,"rota");
        const rec={rota,gaiola:gj(row,"gaiola"),rua:gj(row,"rua"),vaga:gj(row,"vaga"),onda:gj(row,"onda"),parada:g(row,"parada"),transp:gj(row,"transp"),veic:gj(row,"veic"),ponto:g(row,"ponto")};
        if(id){let per=idx.get(id);if(!per){per=new Map();idx.set(id,per)}const p=per.get(cic)||{id,ciclo:cic,fontes:[]};fillE(p,rec);if(!p.fontes.includes(s.name))p.fontes.push(s.name);per.set(cic,p)}
        else if(rota){const key=cic+"|"+rk(rota);const rt=routeIdx.get(key)||{rota,ciclo:cic};
          fillE(rt,{gaiola:rec.gaiola,rua:rec.rua,vaga:rec.vaga,onda:rec.onda,transp:rec.transp,veic:rec.veic,ponto:rec.ponto});
          if(!routeIdx.has(key)){routeIdx.set(key,rt);const l=routeByName.get(rk(rota))||[];l.push(rt);routeByName.set(rk(rota),l)}
          if(rec.gaiola&&!isSaca(rec.gaiola)&&rk(rec.gaiola)!==rk(rota)){const l=routeByName.get(rk(rec.gaiola))||[];if(!l.includes(rt))l.push(rt);routeByName.set(rk(rec.gaiola),l)}}}}}
  function routeFor(ciclo,rota){if(!rota)return null;const r=routeIdx.get(ciclo+"|"+rk(rota));if(r)return r;const l=routeByName.get(rk(rota))||[];return l.find(x=>x.ciclo===ciclo)||l[0]||null}
  const ruaTxt=v=>{const s=String(v||"").trim();if(!s)return "";return /^\d+$/.test(s)?"Rua "+s:s};
  function lookup(rawId){const id=normId(rawId);if(!id)return {id,matches:[]};
    const per=idx.get(id)||idx.get(id.replace(/^0+/,""));if(!per)return {id,matches:[]};
    let ents=[...per.values()].map(e=>({...e}));const withR=ents.filter(e=>e.rota),noR=ents.filter(e=>!e.rota);
    if(withR.length){const hint=noR.find(e=>e.ciclo!==SEMC);withR.forEach(w=>{if(w.ciclo===SEMC&&hint)w.ciclo=hint.ciclo;if(noR[0])fillE(w,{ponto:noR[0].ponto})});ents=withR}else ents=noR;
    const matches=ents.map(p=>{
      if(!p.rota)return {semRota:true,id,ciclo:p.ciclo,ponto:p.ponto||"",fontes:p.fontes};
      const rt=routeFor(p.ciclo,p.rota)||{};const transp=p.transp||rt.transp||"",veic=p.veic||rt.veic||"";const gai=p.gaiola||rt.gaiola||"";
      let saca=null;if(isSaca(gai)){const mae=p.rota.replace(/_\d+$/,"");const rm=mae!==p.rota?routeFor(p.ciclo,mae):null;saca={mae,gaiola:rm&&rm.gaiola&&!isSaca(rm.gaiola)?rm.gaiola:""}}
      return {id,saca,ciclo:p.ciclo,rota:p.rota,gaiola:gai,rua:ruaTxt(p.rua||rt.rua),vaga:p.vaga||rt.vaga||"",onda:p.onda||rt.onda||"",parada:p.parada||"",ponto:p.ponto||rt.ponto||"",transp,veic,sigla:matchCarrier(transp)||"",fontes:p.fontes};
    }).sort((a,b)=>cycSort(a.ciclo,b.ciclo));
    return {id,matches}}
  const destLabel=m=>m.saca?"SACA "+m.rota:(m.gaiola||m.rota||"—");
  function cyclesInfo(){const m={};for(const per of idx.values())for(const [c,p] of per){const o=m[c]||(m[c]={pkgs:0,routes:0});o.pkgs++}
    for(const rt of routeIdx.values()){const o=m[rt.ciclo]||(m[rt.ciclo]={pkgs:0,routes:0});o.routes++}return m}
  /* planejamento em texto: "ONTIME - SD_1 / G2_SD" */
  const PLAN_LINE=/^\s*(.+?)\s+[-–—]\s+([A-Za-z0-9]+(?:_[A-Za-z0-9]+)+|[A-Za-z0-9_]+)\s*\/\s*([A-Za-z0-9]+(?:_[A-Za-z0-9]+)*)\s*$/;
  function planSourcesFromLines(lines,name,fb){const rows=[];lines.forEach(l=>{const m=String(l).match(PLAN_LINE);if(m)rows.push({transp:m[1].trim(),rota:m[2].toUpperCase(),gaiola:m[3].toUpperCase()})});
    if(rows.length<2)return [];const by={};rows.forEach(r=>{const c=cicloFrom(r.rota)||cicloFrom(r.gaiola)||fb||"";(by[c]=by[c]||[]).push([r.transp,r.rota,r.gaiola,c])});
    const headers=["MLP","ROTA","GAIOLA","CICLO"];
    return Object.keys(by).map(c=>({id:"txt|"+name+"|"+c+"|"+Date.now(),name:Object.keys(by).length>1?name+" · "+(c||SEMC):name,ciclo:c,headers,rows:by[c],map:detectMap(headers),txt:true}))}
  async function readFile(f){let wb;try{wb=await svcReadWorkbook(f)}catch(e){console.error("Leitura",f.name,e);return {out:[],err:f.name}}
    const out=[];const fileCyc=cicloFrom(f.name);
    wb.SheetNames.forEach(sn=>{try{const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:"",raw:true,blankrows:false});if(aoa.length<2)return;
      const nm=wb.SheetNames.length>1?f.name+" › "+sn:f.name;const hr=findHeaderRow(aoa);const headers=(aoa[hr]||[]).map(cell);
      const rows=aoa.slice(hr+1).filter(r=>r.some(c=>c!==""&&c!==null)).map(r=>headers.map((_,i)=>cell(r[i])));const map=detectMap(headers);
      if(map.id<0&&map.rota<0&&map.gaiola<0){out.push(...planSourcesFromLines(aoa.flat().map(cell).filter(Boolean),nm,cicloFrom(sn)||fileCyc));return}
      if(map.rota<0&&map.gaiola>=0)map.rota=map.gaiola;
      out.push({id:f.name+"|"+sn+"|"+Date.now(),name:nm,ciclo:cicloFrom(sn)||fileCyc,headers,rows,map})}catch(e){console.error("Aba",sn,e)}});
    return {out,err:out.length?"":f.name}}
  const roleOf=s=>(s.map.id>=0?"i":"")+(s.map.rota>=0?"r":"");
  function addSources(add,replace){if(replace){const names=new Set(add.map(s=>s.name));
      sources=sources.filter(s=>!(s.ciclo&&add.some(a=>a.ciclo===s.ciclo&&roleOf(a)===roleOf(s)))&&!names.has(s.name))}
    sources=sources.concat(add);rebuild();save()}
  function compact(s){const keep=[...new Set(Object.values(s.map).filter(i=>i>=0))].sort((a,b)=>a-b);const pos={};keep.forEach((c,i)=>pos[c]=i);
    const map={};for(const k in s.map)map[k]=s.map[k]>=0?pos[s.map[k]]:-1;return {id:s.id,name:s.name,ciclo:s.ciclo,txt:s.txt,headers:keep.map(c=>s.headers[c]),rows:s.rows.map(r=>keep.map(c=>r[c])),map}}
  let onChangeCb=null,onStateCb=null;
  const save=()=>{sources=sources.map(compact);IDB.set("sources",sources);if(onChangeCb)onChangeCb()};
  function replaceSources(list){sources=Array.isArray(list)?list:[];rebuild();return IDB.set("sources",sources)}
  let loaded=false,loadPromise=null;
  async function load(){
    if(loaded)return sources;
    if(loadPromise)return loadPromise;
    loadPromise=(async()=>{const s=await IDB.get("sources");sources=Array.isArray(s)?s:[];rebuild();loaded=true;return sources})();

/* ============ A MAIS · NUVEM (bases, conexões e aduana iguais em todos os PCs) ============ */
const AMXS=(()=>{
  const IDX="amx-index",EST="amx-estado",T="svc_shared_state";
  const st={status:"",at:"",err:"",info:""};const subs=new Set();const set=o=>{Object.assign(st,o);subs.forEach(f=>f({...st}))};
  const lg=k=>{try{return localStorage.getItem(k)}catch(e){return null}};const ls=(k,v)=>{try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}};
  const hhmm=()=>new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const errTxt=e=>String(e&&(e.message||e.error_description||e.details||e.code)||e||"erro").slice(0,140);
  const sig=s=>s.id+"|"+(s.ciclo||"")+"|"+s.rows.length+"|"+JSON.stringify(s.map);
  async function gz(str){if(!window.CompressionStream)return "j:"+str;
    const buf=new Uint8Array(await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
    let bin="";for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));return "g:"+btoa(bin)}
  async function ungz(z){if(z.startsWith("j:"))return z.slice(2);const bin=atob(z.slice(2));const buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
    return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}
  async function sb(){await svcEnsureSB();if(!svcSB)throw new Error("sem conexão com a nuvem");return svcSB}
  async function getRow(k){const c=await sb();const {data,error}=await c.from(T).select("payload").eq("state_key",k).maybeSingle();if(error)throw error;return data?.payload||null}
  async function putRow(k,payload){const c=await sb();const {error}=await c.from(T).upsert({state_key:k,payload,updated_at:new Date().toISOString()},{onConflict:"state_key"});if(error)throw error}
  const srcKey=id=>"amx-src:"+id;
  /* ---- bases ---- */
  let pushing=null,again=false,pulling=false;
  function markDirty(){ls("amx-dirty","1");pushBases()}
  function pushBases(){if(pushing){again=true;return pushing}
    pushing=(async()=>{try{do{again=false;const list=AMX.sources;const sent=JSON.parse(lg("amx-sent")||"{}");
        for(const s of list){const g=sig(s);if(sent[s.id]===g)continue;set({status:"enviando",err:"",info:s.name});

      catch(e){console.error("A mais · nuvem",e);set({status:"erro",err:errTxt(e),info:""})}finally{pushing=null}})();return pushing}
  async function pullBases(){if(pulling||pushing)return;pulling=true;
    try{const idx=await getRow(IDX);const local=+lg("amx-ver")||0;
      if(!idx||!Array.isArray(idx.items)){if(AMX.sources.length){pulling=false;return pushBases()}set({status:"ok",at:hhmm(),err:""});return}
      if(lg("amx-dirty")){pulling=false;return pushBases()}
      if(idx.ver<=local){set({status:"ok",at:hhmm(),err:""});return}

  async function pullEstado(){try{if(lg("amx-est-dirty"))return pushEstado();const r=await getRow(EST);if(!r)return;
      if((+r.at||0)>(+lg("amx-est-at")||0)){applying=true;try{AMX.lsSet("conns",r.conns||[]);AMX.lsSet("adText",r.adText||"")}finally{applying=false}

    return sync()}
  return {start,sync,pushBases,subscribe:f=>{subs.add(f);f({...st});return()=>subs.delete(f)},get state(){return {...st}}};
})();

/* ============ GUIADA DA EQUIPE · quem fica em cada vaga (por layout) ============ */
const RESP_KEY="svc-resp";
function getRespAll(){try{return JSON.parse(localStorage.getItem(RESP_KEY)||"{}")||{}}catch(e){return {}}}
function getResp(lk){const o=getRespAll()[lk];return (o&&Array.isArray(o.people)?o.people:[]).filter(p=>p&&String(p.nome||"").trim()&&(p.vagas||[]).length)}
function respOfVaga(lk,v){if(!lk||!v)return [];return getResp(lk).filter(p=>p.vagas.includes(+v))}
function respOfRuas(lk,ruas){if(!lk||!ruas||!ruas.length)return [];return getResp(lk).filter(p=>p.vagas.some(v=>ruas.includes(rua(v))))}
const respNames=list=>list.map(p=>String(p.nome).trim()).join(", ");
const VAGAS_OK=new Set([...Array(97)].map((_,i)=>i+1).filter(v=>v!==33));
// "1-21" na coluna esquerda pula de 2 em 2 (ímpares ou pares); "R3" ou "Rua 3" pega a rua inteira
function parseVagas(t){const out=new Set();
  String(t||"").toUpperCase().replace(/RUA\s*/g,"R").split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).forEach(tok=>{
    let m=tok.match(/^R\s*([1-5])$/);if(m){LR_NUMS[+m[1]].forEach(v=>out.add(v));return}
    m=tok.match(/^(\d{1,2})\s*(?:-|–|A|ATE|ATÉ)\s*(\d{1,2})$/);
    if(m){let a=+m[1],b=+m[2];if(a>b)[a,b]=[b,a];const step=(b<=34&&a%2===b%2)?2:1;for(let v=a;v<=b;v+=step)out.add(v);return}
    tok.split(/\s+/).forEach(x=>{const n=parseInt(x,10);if(n)out.add(n)})});
  return [...out].filter(v=>VAGAS_OK.has(v)).sort((a,b)=>a-b)}
const hoje=()=>new Date().toLocaleDateString("pt-BR");

async function renderEquipePages(cur,L,people){
  try{await document.fonts.ready}catch(e){}
  const W=1080,H=1920,P=40,F=(w,s)=>`${w} ${s}px Onest, Arial, sans-serif`;
  const og={};planGaiolas().forEach(r=>{og[normTxt(r.g)]=r.onda;og[normTxt(shortTag(r.g))]=r.onda});
  const out=[];const mk=()=>{const cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
    const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
    g.fillStyle="#f4f6f8";g.fillRect(0,0,W,H);return {cv,g,rr}};
  const fit=(g,t,max)=>{t=String(t);while(g.measureText(t).width>max&&t.length>2)t=t.slice(0,-1);return t};
  const head=(g,title,sub,pg)=>{g.fillStyle="#0a4d8c";g.fillRect(0,0,W,168);g.fillStyle="#fff";g.textAlign="left";g.textBaseline="alphabetic";g.font=F(800,60);g.fillText(fit(g,title,W-2*P),P,86);
    g.font=F(600,28);g.fillText(sub,P,138);if(pg){g.textAlign="right";g.font=F(700,24);g.fillText(pg,W-P,138)}};
  const foot=(g,t)=>{g.fillStyle="#0a4d8c";g.fillRect(0,H-64,W,64);g.fillStyle="#fff";g.font=F(700,24);g.textAlign="center";g.textBaseline="middle";g.fillText(t,W/2,H-32)};
  // página 1: resumo de quem fica onde
  {const {cv,g,rr}=mk();head(g,"GUIADA DA EQUIPE",`Layout ${cur} · ${hoje()}`,"");let y=204;
    people.forEach((p,i)=>{if(y>H-200)return;const ruas=[...new Set(p.vagas.map(rua))].sort();const ks=[...new Set(p.vagas.map(v=>L.map[v]).filter(k=>k&&k!=="X"&&k!=="V"))];
      g.fillStyle=i%2?"#eef1f5":"#fff";rr(P,y,W-2*P,128,16);g.fill();g.fillStyle="#111";g.textAlign="left";g.textBaseline="middle";g.font=F(800,40);g.fillText(fit(g,String(p.nome).toUpperCase(),W-2*P-60),P+28,y+42);
      g.font=F(600,26);g.fillStyle="#374151";g.fillText(fit(g,ruas.map(r=>"Rua "+r).join(" · ")+"  ·  vagas "+ranges(p.vagas),W-2*P-60),P+28,y+90);
      let x=W-P-24;g.textAlign="center";[...ks].reverse().slice(0,6).forEach(k=>{const c=CARRIERS[k];x-=62;g.fillStyle=c.bg;rr(x,y+18,56,38,8);g.fill();g.strokeStyle="rgba(0,0,0,.3)";g.lineWidth=1.5;g.stroke();g.fillStyle=c.fg;g.font=F(800,20);g.fillText(k,x+28,y+38)});
      y+=142});
    foot(g,"GUIADA · Operação MEGARIO");out.push(cv)}
  // uma página (ou mais) por pessoa, vaga a vaga
  const RH=96,TOP=300,PER=Math.floor((H-64-TOP-20)/RH);
  people.forEach(p=>{const vs=p.vagas;const pages=Math.max(1,Math.ceil(vs.length/PER));const ruas=[...new Set(vs.map(rua))].sort();
    for(let pi=0;pi<pages;pi++){const {cv,g,rr}=mk();head(g,"GUIADA · "+String(p.nome).toUpperCase(),`Layout ${cur} · ${ruas.map(r=>"Rua "+r).join(", ")} · ${hoje()}`,pages>1?`página ${pi+1}/${pages}`:"");
      g.fillStyle="#374151";rr(P,196,W-2*P,56,12);g.fill();g.fillStyle="#fff";g.font=F(800,26);g.textBaseline="middle";
      [["VAGA",P+70,"center"],["TRANSPORTADORA",P+170,"left"],["GAIOLA",700,"left"],["ONDA",W-P-70,"center"]].forEach(([t,x,al])=>{g.textAlign=al;g.fillText(t,x,224)});
      vs.slice(pi*PER,(pi+1)*PER).forEach((v,i)=>{const y=TOP-36+i*RH;const k=L.map[v]||"V";const c=CARRIERS[k]||CARRIERS.V;const tag=L.tags[v]||"";
        g.fillStyle=i%2?"#eef1f5":"#fff";rr(P,y,W-2*P,RH-10,14);g.fill();
        g.fillStyle="#0a4d8c";rr(P+14,y+12,112,RH-34,12);g.fill();g.fillStyle="#fff";g.textAlign="center";g.font=F(800,40);g.fillText(String(v),P+70,y+(RH-10)/2+2);
        g.fillStyle=c.bg;rr(P+150,y+14,86,RH-38,10);g.fill();g.strokeStyle="rgba(0,0,0,.3)";g.lineWidth=1.5;g.stroke();g.fillStyle=c.fg;g.font=F(800,28);g.fillText(k==="V"?"—":k,P+193,y+(RH-10)/2+2);
        g.fillStyle="#111";g.textAlign="left";g.font=F(700,30);g.fillText(fit(g,k==="X"?"Bloqueada":k==="V"?"Vazia":c.n,390),P+252,y+(RH-10)/2+2);
        g.font=F(800,34);g.fillText(tag?fit(g,shortTag(tag),240):"—",700,y+(RH-10)/2+2);
        const o=tag?(og[normTxt(tag)]??og[normTxt(shortTag(tag))]):null;g.textAlign="center";g.font=F(800,34);g.fillText(o!=null?String(o):"—",W-P-70,y+(RH-10)/2+2)});
      foot(g,`GUIADA · ${String(p.nome).toUpperCase()} · Layout ${cur}`);out.push(cv)}});
  return await Promise.all(out.map(cv=>new Promise(r=>cv.toBlob(r,"image/png"))));
}

function EquipeModal({cur,L,people,onClose}){

  const base=`guiada-equipe-${cur}-${hoje().replace(/\//g,"-")}`;
  const text=`*GUIADA DA EQUIPE – ${cur}*\n${hoje()}\n`+people.map(p=>`▸ *${p.nome}*: ${[...new Set(p.vagas.map(rua))].sort().map(r=>"Rua "+r).join(", ")} · vagas ${ranges(p.vagas)}`).join("\n");

    try{const d=window.claude?.use?await window.claude.use("downloads"):null;if(d){await d.save({filename:nm,data:blobs[i]});continue}}catch(e){}
    const a=document.createElement("a");a.href=urls[i];a.download=nm;document.body.appendChild(a);a.click();a.remove();await new Promise(r=>setTimeout(r,300))}setMsg("Imagens baixadas.")};
  const shareOne=async i=>{const f=new File([blobs[i]],`${base}-${i+1}.png`,{type:"image/png"});

    try{await navigator.clipboard.write([new ClipboardItem({"image/png":blobs[i]})]);setMsg(`Imagem de ${names[i]} copiada. Cole na conversa com Ctrl+V.`)}catch(e){setMsg("Não deu para copiar aqui. Use Baixar imagens.")}};
  return html`<${motion.div} class="fixed inset-0 z-[200] flex items-center justify-center p-4" initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} style=${{background:"rgba(3,5,8,.72)",backdropFilter:"blur(6px)"}} onClick=${onClose}>
    <${motion.div} onClick=${e=>e.stopPropagation()} initial=${{y:24}} animate=${{y:0}} exit=${{y:24,opacity:0}} transition=${spring} class="glass rounded-3xl p-4 sm:p-5 w-full max-w-4xl max-h-[92vh] flex flex-col gap-3" style=${{background:"rgba(16,20,26,.97)"}}>
      <div class="flex flex-wrap items-center justify-between gap-3"><div><div class="text-[11px] uppercase tracking-[.16em] text-muted font-semibold">Imagens para o celular · uma por pessoa</div><div class="font-display text-lg">Guiada da equipe · ${cur}</div></div>
        <button type="button" onClick=${onClose} class="text-muted hover:text-ink text-sm px-3 py-1.5 rounded-full border border-white/15">Fechar</button></div>
      <div class="flex-1 min-h-0 overflow-auto rounded-2xl bg-black/30 p-3">
        ${urls.length?html`<div class="flex gap-3 overflow-x-auto pb-2">${urls.map((u,i)=>html`<div key=${u} class="shrink-0 flex flex-col gap-2 items-center" style=${{width:"min(260px,66vw)"}}>
            <img src=${u} alt=${"Guiada "+names[i]} class="w-full h-auto rounded-xl shadow-lg"/>
            <button type="button" onClick=${()=>shareOne(i)} class="text-xs font-semibold px-3 py-1.5 rounded-full border border-white/20 hover:bg-white/10 max-w-full truncate">${isMobile()?"Enviar":"Copiar"} · ${names[i]}</button></div>`)}</div>`
          :html`<div class="flex gap-3">${[0,1,2].map(i=>html`<div key=${i} class="sk shrink-0" style=${{width:"min(260px,66vw)",height:420}}></div>`)}</div>`}

const SVC_SB_URL="https://cjentqthseecgizptyqe.supabase.co";

const SVC_STATE_KEY="svc-operacao";
let svcSB=null;
async function svcEnsureSB(){
  if(svcSB)return svcSB;

let svcRemoteReady=false, svcSaveTimer=null, svcApplyingRemote=false;
/* o planejamento mais novo sempre ganha: evita que uma cópia antiga do servidor apague o que acabou de ser importado */
const svcPlanTime=p=>p&&typeof p==="object"&&+p.savedAt||0;
function svcLocalPlan(){try{return JSON.parse(localStorage.getItem("svc-plan2")||"null")}catch(e){return null}}

function svcSnapshot(edits,tagOv,geos,readAt,respAll){
  let plan=null;try{plan=JSON.parse(localStorage.getItem("svc-plan2")||"null")}catch(e){}
  return {edits,tagOv,geos,readAt,respAll,plan,updatedAt:new Date().toISOString()};
}
async function svcLoadRemote(){
  try{await svcEnsureSB()}catch(e){console.error("SVC Supabase lib",e);return null}
  if(!svcSB)return null;
  const {data,error}=await svcSB.from("svc_shared_state").select("payload").eq("state_key",SVC_STATE_KEY).maybeSingle();
  if(error){console.error("SVC load",error);return null}
  return data?.payload||null;
}
async function svcPatchRemote(patch){
  if(svcApplyingRemote)return;
  try{await svcEnsureSB()}catch(e){return}
  if(!svcSB)return;
  clearTimeout(svcSaveTimer);
  svcSaveTimer=setTimeout(async()=>{
    const {data,error:readErr}=await svcSB.from("svc_shared_state").select("payload").eq("state_key",SVC_STATE_KEY).maybeSingle();
    if(readErr){console.error("SVC read before save",readErr);return}
    const payload={...(data?.payload||{}),...patch,updatedAt:new Date().toISOString()};
    const lp=svcLocalPlan();if(svcPlanTime(lp)>svcPlanTime(payload.plan))payload.plan=lp;
    const {error}=await svcSB.from("svc_shared_state").upsert(
      {state_key:SVC_STATE_KEY,payload,updated_at:new Date().toISOString()},
      {onConflict:"state_key"}
    );
    if(error)console.error("SVC save",error);
  },650);
}
const svcPlanSync=(ok,err)=>{window.__svcPlanSync={ok,err:err||"",at:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};window.dispatchEvent(new Event("svc-plan-sync"))};
async function svcSavePlanRemote(plan){
  if(svcApplyingRemote)return;
  try{await svcEnsureSB()}catch(e){svcPlanSync(false,"sem conexão com a nuvem");return}
  if(!svcSB){svcPlanSync(false,"sem conexão com a nuvem");return}
  const {data,error:rErr}=await svcSB.from("svc_shared_state").select("payload").eq("state_key",SVC_STATE_KEY).maybeSingle();
  if(rErr){console.error("SVC plan read",rErr);svcPlanSync(false,rErr.message||"erro ao ler a nuvem");return}
  const payload={...(data?.payload||{}),plan,updatedAt:new Date().toISOString()};
  const {error}=await svcSB.from("svc_shared_state").upsert(
    {state_key:SVC_STATE_KEY,payload,updated_at:new Date().toISOString()},
    {onConflict:"state_key"}
  );
  if(error){console.error("SVC plan save",error);svcPlanSync(false,error.message||"erro ao salvar")}else svcPlanSync(true);
}
function svcCacheRemote(p){
  try{
    if(p.edits)localStorage.setItem("svc-edits",JSON.stringify(p.edits));
    if(p.tagOv)localStorage.setItem("svc-tags",JSON.stringify(p.tagOv));
    if(p.geos)localStorage.setItem("svc-geo9",JSON.stringify(p.geos));
    if(p.readAt)localStorage.setItem("svc-read-at",JSON.stringify(p.readAt));
    if(p.respAll)localStorage.setItem(RESP_KEY,JSON.stringify(p.respAll));
    if(Object.prototype.hasOwnProperty.call(p,"plan")){
      const oldPlan=svcLocalPlan();
      if(svcPlanTime(oldPlan)>svcPlanTime(p.plan)){const mine=oldPlan;setTimeout(()=>{svcApplyingRemote=false;svcSavePlanRemote(mine)},400)}
      else if(JSON.stringify(oldPlan)!==JSON.stringify(p.plan)){
        if(p.plan==null)localStorage.removeItem("svc-plan2");
        else localStorage.setItem("svc-plan2",JSON.stringify(p.plan));
        window.dispatchEvent(new CustomEvent("svc-plan-remote",{detail:p.plan}));
      }
    }
  }catch(e){}
}

        :view==="amais"?html`<${AMaisView} key="amais" layoutOf=${layoutOf} goVaga=${goVaga}/>`
        :view==="plan"?html`<${PlanView} key="plan" cur=${cur} L=${L} setCur=${setCur} onZero=${onZero} onApplyRead=${onApplyRead} onDistribute=${onDistribute} goLayout=${()=>{setView("planta");window.scrollTo({top:0,behavior:"smooth"})}}/>`
        :html`<${motion.div} key="ok" variants=${stagger} initial="hidden" animate="show" class="grid grid-cols-1 md:grid-cols-12 gap-4">
            <${Hero} cur=${cur} L=${L}/>
            <${Search} L=${L} onPick=${pick}/>
            <${Plant} cur=${cur} L=${L} filter=${filter} sel=${sel} onPick=${pick} onEdit=${onEdit} onGeo=${onGeo} onTag=${onTag} onZero=${onZero} onApplyRead=${onApplyRead} onDistribute=${onDistribute} onUndo=${onUndo} onReset=${onReset} canUndo=${(hist[cur]||[]).length>0} edited=${!!edits[cur]||!!geos[cur]||!!(tagOv[cur]&&Object.keys(tagOv[cur]).length)}/>
            <${Carriers} L=${L} filter=${filter} setFilter=${pickFilter}/>
            <${Detail} L=${L} filter=${filter} sel=${sel}/>
            <${Table} cur=${cur} L=${L}/>
          </${motion.div}>`}
      </${AnimatePresence}>
    </main>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</html>
